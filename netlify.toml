# Netlify configuration for SPOKEN
# Build regenerates dist/ (pre-rendered HTML + SEO) from content/*.json.

[build]
  command = "node build.mjs"
  publish = "dist"

# Force the canonical host (www) so SEO value isn't split across two URLs.
[[redirects]]
  from = "https://spokenfestival.be/*"
  to = "https://www.spokenfestival.be/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
