<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPOKEN · Griezelfestival — Antwerpen & Kortrijk · 31 OKT – 01 NOV 2026</title>
<meta name="description" content="SPOKEN — griezelfestival over het spookachtige, één weekend tegelijk in Antwerpen en Kortrijk. Spookverhalen, essays, poëzie en spoken word.">
<meta name="theme-color" content="#0b0a09">
<!-- BUILD:SEO --> <!-- build.mjs injects canonical, refined meta/OG/Twitter and JSON-LD LiteraryEvent here (Open Graph tags are intentionally only in the built output) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     SPOKEN v3 — illustrated identity (hand-painted artwork, Amatic SC).
     Fixed palette per the design handoff: charcoal grounds, chalk blue
     (Antwerpen) vs burnt orange (Kortrijk), shared scrawl yellow. The old
     multi-palette system was retired with this design: colors are final.
     ===================================================================== */
  :root{
    --f-display:'Amatic SC', cursive;
    --f-body:'Space Grotesk', sans-serif;
    --f-mono:'Space Mono', monospace;
    --disp-tr:none; --disp-sp:0.02em; --disp-wt:700; --radius:0px;
    --yellow:#e6d33b; --on-yellow:#141210;
    /* how far the visible screen falls short of the layout viewport (mobile
       browser address bar) — kept in sync by JS via the visualViewport API,
       so fixed bottom elements can compensate. See citytoggle. */
    --vv-lift:0px;
  }
  html, body { margin:0; height:100%; background:#0b0a09; }
  * { box-sizing:border-box; }
  body{ font-family:var(--f-body); color:#f3ede2; overflow:hidden; }
  a { color:var(--yellow); } a:hover { color:#fff; }
  ::-webkit-scrollbar { width:7px; height:7px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.14); border-radius:4px; }
  ::-webkit-scrollbar-track { background:transparent; }

  @keyframes hintPulse { 0%,100%{opacity:0.35;} 50%{opacity:0.85;} }
  @keyframes echoDrift { 0%,100%{transform:translate(0,0); opacity:0.16;} 50%{transform:translate(7px,-5px); opacity:0.30;} }
  @keyframes grainShift { 0%{transform:translate(0,0);} 20%{transform:translate(-12%,6%);} 40%{transform:translate(8%,-10%);} 60%{transform:translate(-6%,10%);} 80%{transform:translate(10%,4%);} 100%{transform:translate(0,0);} }
  @keyframes figFloat { 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-14px) rotate(0.6deg);} }
  @keyframes faceBreathe { 0%,100%{opacity:0.20;} 50%{opacity:0.30;} }
  @keyframes rise { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .stage{ position:fixed; inset:0; display:flex; overflow:hidden; background:#0b0a09; }

  .panel{
    flex:1 1 0%; min-width:0; position:relative; overflow:hidden;
    background:var(--bg); color:var(--fg);
    transition:flex-grow 1.25s cubic-bezier(0.16,1,0.3,1);
  }
  .panel[data-id="ant"]{ --bg:#12100e; --fg:#efe9dd; --mut:#93897a; --acc:#8ec8d8; --glow:rgba(142,200,216,0.16); --line:rgba(239,233,221,0.16); }
  .panel[data-id="kor"]{ --bg:#131009; --fg:#f1eadd; --mut:#98897a; --acc:#e0703f; --glow:rgba(224,112,63,0.16); --line:rgba(241,234,221,0.16); }

  /* painted face backdrop: each city carries half the screaming face,
     seam down the nose; melts away before the fold */
  .face-bg{
    position:absolute; top:0; left:0; right:0; height:88vh; z-index:0; pointer-events:none;
    background-image:url('assets/img/gezicht.jpg');
    background-size:200% auto; background-repeat:no-repeat;
    mix-blend-mode:lighten;
    -webkit-mask-image:linear-gradient(180deg, black 30%, transparent 92%);
    mask-image:linear-gradient(180deg, black 30%, transparent 92%);
    animation:faceBreathe 12s ease-in-out infinite;
  }
  /* hero figure: painted on black, lighten-blend melts it into the ground;
     JS slides it up + fades it out as the panel scrolls */
  .panel-fig{
    position:absolute; right:2%; bottom:3%; z-index:1; pointer-events:none;
    width:clamp(180px,24vw,340px); height:clamp(320px,58vh,620px);
    background-size:contain; background-repeat:no-repeat; background-position:bottom right;
    mix-blend-mode:lighten; opacity:0.9; transition:opacity 0.15s linear;
  }

  .scroll{ position:absolute; inset:0; z-index:2; overflow-y:auto; overflow-x:hidden; }
  .content{ min-height:100%; padding:clamp(34px,4.2vw,76px); display:flex; flex-direction:column; gap:clamp(54px,6vw,96px); }

  /* ---- hero ---- */
  .hero{ min-height:74vh; position:relative; display:flex; flex-direction:column; justify-content:flex-end; gap:20px; padding-bottom:8px; }
  .hero > *{ position:relative; }
  .hero-scrim{
    position:absolute; left:calc(-1 * clamp(34px,4.2vw,76px)); right:calc(-1 * clamp(34px,4.2vw,76px));
    bottom:-14px; top:18%; pointer-events:none;
    background:linear-gradient(180deg, transparent, var(--bg) 55%); opacity:0.85;
  }
  .masthead{ display:flex; align-items:center; gap:18px; }
  .masthead .line{ flex:1; height:1px; background:var(--line); }
  .masthead-date{ font-family:var(--f-display); font-weight:700; font-size:26px; letter-spacing:0.1em; color:var(--yellow); transform:rotate(-2deg); white-space:nowrap; }

  /* the painted SPOKEN wordmark — its O is a living eye */
  .wordmark{
    position:relative; width:clamp(200px,21vw,330px); flex-shrink:0;
    -webkit-mask-image:linear-gradient(0deg, transparent, black 14%, black 86%, transparent);
    mask-image:linear-gradient(0deg, transparent, black 14%, black 86%, transparent);
  }
  .wm-img{
    width:100%; display:block;
    -webkit-mask-image:linear-gradient(90deg, transparent, black 7%, black 93%, transparent);
    mask-image:linear-gradient(90deg, transparent, black 7%, black 93%, transparent);
  }
  .eye{ position:absolute; left:42.6%; top:1.5%; width:16%; height:97%; pointer-events:none; }
  .eye-clip{ position:absolute; inset:0; clip-path:ellipse(26% 30% at 50% 48%); overflow:hidden; }
  .eye-iris{ position:absolute; inset:0; transition:transform 0.5s cubic-bezier(0.22,0.61,0.36,1); }
  .eye-iris img{ position:absolute; left:-266.25%; top:-1.55%; width:625%; height:103.1%; max-width:none; }
  .eye-lid{ position:absolute; inset:0; width:100%; height:100%; object-fit:fill; opacity:0; transition:opacity 0.04s linear; }
  .eye[data-frame="1"] .eye-lid[data-lid="1"]{ opacity:1; }
  .eye[data-frame="2"] .eye-lid[data-lid="2"]{ opacity:1; }
  .eye[data-frame="3"] .eye-lid[data-lid="3"]{ opacity:1; }

  .hero-subtitle{ margin:0; font-style:italic; font-size:clamp(17px,1.8vw,24px); color:var(--fg); max-width:36ch; line-height:1.4; text-shadow:0 0 20px var(--glow); }
  .title-wrap{ position:relative; }
  .title-echo, .title{
    margin:0; font-family:var(--f-display); font-weight:700;
    font-size:clamp(84px,11vw,190px); line-height:0.9; letter-spacing:0.02em;
  }
  .title-echo{ position:absolute; inset:0; color:var(--acc); filter:blur(9px); animation:echoDrift 9s ease-in-out infinite; pointer-events:none; }
  .title{ position:relative; text-shadow:0 0 38px var(--glow); }
  .tagline{ margin:0; font-size:clamp(16px,1.5vw,21px); color:var(--mut); max-width:34ch; line-height:1.45; text-wrap:pretty; }
  .meta-row{ display:flex; flex-wrap:wrap; align-items:center; gap:18px 26px; margin-top:4px; font-family:var(--f-mono); font-size:12px; letter-spacing:0.06em; color:var(--fg); }
  .meta-row .dot{ width:5px; height:5px; border-radius:50%; background:var(--acc); }
  .meta-row .venue{ color:var(--mut); }
  .cta-row{ display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-top:12px; }
  .btn-tickets{
    display:inline-flex; align-items:center; gap:10px; padding:12px 26px;
    background:var(--yellow); color:var(--on-yellow);
    font-family:var(--f-display); font-weight:700; font-size:24px; letter-spacing:0.14em; text-transform:uppercase;
    cursor:pointer; border:0; text-decoration:none;
    transform:rotate(-1.2deg); box-shadow:3px 4px 0 rgba(0,0,0,0.55);
    transition:filter .25s ease;
  }
  .btn-tickets:hover{ filter:brightness(1.1); color:var(--on-yellow); }
  .twin{ font-family:var(--f-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--mut); }

  /* ---- sections ---- */
  .sec-head{ display:flex; align-items:baseline; gap:16px; margin-bottom:26px; }
  .sec-head h2{ margin:0; font-family:var(--f-display); font-weight:700; font-size:clamp(42px,4.4vw,66px); line-height:1; letter-spacing:0.03em; }
  .sec-head .line{ flex:1; height:1px; background:var(--line); }
  .expand-hint{ font-family:var(--f-mono); font-size:11px; letter-spacing:0.2em; color:var(--mut); cursor:pointer; transition:color .2s ease; }
  .expand-hint:hover{ color:var(--acc); }

  .day{ margin-bottom:34px; }
  .day-head{ display:flex; align-items:center; gap:12px; margin-bottom:6px; font-family:var(--f-display); font-weight:700; font-size:24px; letter-spacing:0.16em; color:var(--yellow); }
  .day-head .date{ color:var(--mut); }
  .day-end{ height:1px; background:var(--line); }

  .slot-row{ display:flex; align-items:center; gap:18px; padding:16px 4px; border-top:1px solid var(--line); cursor:pointer; }
  .slot-time{ font-family:var(--f-mono); font-size:13px; color:var(--mut); min-width:48px; }
  .slot-artist{ flex:1; font-family:var(--f-display); font-weight:700; font-size:clamp(28px,2.6vw,40px); line-height:0.95; letter-spacing:0.02em; }
  .slot-stage{ font-family:var(--f-mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--mut); text-align:right; max-width:13ch; }
  .slot-chev{ font-family:var(--f-mono); font-size:18px; line-height:1; color:var(--acc); width:18px; text-align:center; }
  .slot-body{ overflow:hidden; max-height:0; opacity:0; transition:max-height 0.7s cubic-bezier(0.22,0.61,0.36,1), opacity 0.5s ease; }
  .slot-body.open{ max-height:360px; opacity:1; }
  .slot-inner{ display:flex; gap:22px; padding:6px 4px 26px 66px; align-items:flex-start; }
  .slot-photo{ width:128px; height:96px; flex-shrink:0; border:1px solid var(--line); background-image:repeating-linear-gradient(45deg, var(--line) 0 1px, transparent 1px 9px); display:flex; align-items:flex-end; padding:7px; font-family:var(--f-mono); font-size:8px; letter-spacing:0.1em; color:var(--mut); }
  .slot-photo.has-img{ padding:0; overflow:hidden; background:none; }
  .slot-photo img{ width:100%; height:100%; object-fit:cover; display:block; filter:saturate(0.85) contrast(1.05); }
  .slot-genre{ font-family:var(--f-mono); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--acc); margin-bottom:9px; }
  .slot-blurb{ margin:0; font-size:15px; line-height:1.6; color:var(--fg); max-width:48ch; }
  .slot-bio{ margin:10px 0 0; font-size:13.5px; line-height:1.55; color:var(--mut); max-width:48ch; }
  .slot-elsewhere{ margin-top:10px; font-family:var(--f-mono); font-size:11px; letter-spacing:0.06em; color:var(--acc); }
  .slot-artist-link{ display:inline-block; margin-top:10px; font-family:var(--f-mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--yellow); text-decoration:none; }
  .slot-artist-link:hover{ text-decoration:underline; }

  /* figure interludes: painted ghosts tucked between sections */
  .interlude{ position:relative; height:clamp(280px,42vh,460px); margin:calc(-1 * clamp(27px,3vw,48px)) 0; pointer-events:none; }
  .interlude-fig{ position:absolute; top:0; bottom:0; width:60%; background-size:contain; background-repeat:no-repeat; opacity:0.9; animation:figFloat 11s ease-in-out infinite; }

  .schema-day{ margin-bottom:30px; }
  .schema-scroll{ overflow-x:auto; padding-bottom:6px; }
  .schema{ display:grid; gap:3px; min-width:540px; }
  .schema-stage{ font-family:var(--f-mono); font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--acc); padding:6px 8px 10px; border-bottom:1px solid var(--line); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .schema-time{ font-family:var(--f-mono); font-size:10px; color:var(--mut); align-self:start; padding-top:1px; }
  .schema-block{ background:var(--glow); border:1px solid var(--acc); padding:5px 8px; overflow:hidden; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .schema-block .t{ font-family:var(--f-mono); font-size:9.5px; letter-spacing:0.06em; color:var(--acc); white-space:nowrap; }
  .schema-block .n{ font-family:var(--f-display); font-weight:700; font-size:17px; line-height:1.05; letter-spacing:0.03em; color:var(--fg); overflow:hidden; text-overflow:ellipsis; }

  .news-item{ padding:20px 0; border-top:1px solid var(--line); }
  .news-date{ font-family:var(--f-mono); font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--yellow); }
  .news-title{ margin:8px 0 0; font-family:var(--f-display); font-weight:700; font-size:clamp(26px,2.6vw,38px); line-height:1.05; letter-spacing:0.02em; }
  .news-par{ margin:10px 0 0; font-size:15px; line-height:1.6; color:var(--fg); max-width:60ch; }
  .news-img{ margin-top:14px; width:100%; max-width:440px; border:1px solid var(--line); display:block; }

  .posters{ display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:18px; }
  .poster{ margin:0; }
  .poster img{ width:100%; display:block; border:1px solid var(--line); }
  .poster figcaption{ margin-top:8px; font-family:var(--f-mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--mut); }

  .info-grid{ display:flex; flex-wrap:wrap; gap:40px; }
  .info-text{ flex:2 1 320px; min-width:260px; display:flex; flex-direction:column; gap:16px; }
  .info-text p{ margin:0; font-size:16px; line-height:1.65; color:var(--fg); }
  .info-facts{ flex:1 1 200px; min-width:180px; display:flex; flex-direction:column; }
  .fact{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:13px 0; border-top:1px solid var(--line); font-family:var(--f-mono); font-size:12px; }
  .fact .k{ color:var(--mut); letter-spacing:0.08em; text-transform:uppercase; }
  .fact .v{ color:var(--acc); text-align:right; }

  .practical{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); overflow:hidden; }
  .practical .cell{ background:var(--bg); padding:22px 20px; display:flex; flex-direction:column; gap:8px; }
  .practical .k{ font-family:var(--f-mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--acc); }
  .practical .v{ font-size:15px; line-height:1.45; color:var(--fg); }

  .ticket{ display:flex; align-items:center; gap:20px; padding:20px 26px; border:1px solid var(--line); }
  .ticket .tier{ font-family:var(--f-display); font-weight:700; font-size:clamp(26px,2.4vw,36px); line-height:1; letter-spacing:0.03em; }
  .ticket .note{ font-family:var(--f-mono); font-size:11px; letter-spacing:0.08em; color:var(--mut); margin-top:7px; }
  .ticket .price{ font-family:var(--f-mono); font-size:22px; color:var(--fg); }
  .ticket .buy{
    padding:9px 20px; border:1.5px solid var(--yellow); color:var(--yellow); background:transparent;
    font-family:var(--f-display); font-weight:700; font-size:21px; letter-spacing:0.14em; text-transform:uppercase;
    cursor:pointer; text-decoration:none; transform:rotate(-1deg); transition:background .25s ease, color .25s ease;
  }
  .ticket .buy:hover{ background:var(--yellow); color:var(--on-yellow); }
  .tickets-list{ display:flex; flex-direction:column; gap:14px; }
  .foot{ margin-top:48px; padding-top:22px; border-top:1px solid var(--line); display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; font-family:var(--f-mono); font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--mut); }

  .edge{ position:absolute; top:0; bottom:0; width:140px; z-index:4; pointer-events:none; }
  .panel[data-side="left"] .edge{ right:-1px; background:linear-gradient(90deg, transparent, rgba(0,0,0,0.45)); }
  .panel[data-side="right"] .edge{ left:-1px; background:linear-gradient(270deg, transparent, rgba(0,0,0,0.45)); }

  .rail{ position:absolute; inset:0; z-index:5; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:38px 0; transition:opacity 0.7s ease; opacity:0; pointer-events:none; }
  .panel.compact .rail{ opacity:1; pointer-events:auto; }
  .rail .mark{ font-family:var(--f-mono); font-size:10px; letter-spacing:0.3em; color:var(--yellow); }
  .rail .mid{ flex:1; display:flex; align-items:center; justify-content:center; }
  .rail .vname{ font-family:var(--f-display); font-weight:700; font-size:clamp(44px,5vw,76px); letter-spacing:0.06em; white-space:nowrap; writing-mode:vertical-rl; color:var(--acc); text-shadow:0 0 26px var(--glow); }
  .rail .botcue{ display:flex; flex-direction:column; align-items:center; gap:10px; font-family:var(--f-mono); font-size:10px; letter-spacing:0.16em; color:var(--mut); }
  .rail .botcue .cue{ color:var(--acc); }

  .seam{ position:absolute; top:0; bottom:0; z-index:45; pointer-events:none; transform:translateX(-50%);
    background:linear-gradient(90deg, transparent, rgba(142,200,216,0.4) 30%, rgba(230,211,59,0.65) 50%, rgba(224,112,63,0.4) 70%, transparent);
    filter:blur(9px); width:64px; opacity:0.3; left:50%;
    transition:left 1.25s cubic-bezier(0.16,1,0.3,1), opacity 0.55s ease, width 0.7s ease, filter 0.7s ease; }
  .seam.flare{ filter:blur(6px); width:150px; opacity:0.9; }

  .vignette{ position:absolute; inset:0; z-index:40; pointer-events:none; background:radial-gradient(ellipse 80% 70% at 50% 45%, transparent 50%, rgba(0,0,0,0.55) 100%); }
  .grain{ position:absolute; inset:-50%; z-index:41; pointer-events:none; opacity:0.06; mix-blend-mode:soft-light; background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%222%22 stitchTiles=%22stitch%22/></filter><rect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/></svg>'); background-size:160px 160px; animation:grainShift 0.9s steps(4) infinite; }

  .controls{ position:absolute; top:18px; left:50%; transform:translateX(-50%); z-index:60; display:flex; gap:12px; align-items:center; }
  .segwrap{ display:flex; align-items:center; background:rgba(14,13,11,0.72); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.12); border-radius:999px; overflow:hidden; }
  .segwrap .label{ padding:0 12px 0 14px; font-family:var(--f-mono); font-size:9px; letter-spacing:0.18em; color:rgba(255,255,255,0.35); }
  .seg{ font-family:var(--f-mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; padding:8px 14px; border:0; cursor:pointer; background:transparent; color:rgba(255,255,255,0.45); transition:all .3s ease; }
  .seg.on{ background:rgba(255,255,255,0.13); color:#fff; }

  .hint{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:55; pointer-events:none; font-family:var(--f-mono); font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color:rgba(255,255,255,0.8); animation:hintPulse 2.6s ease-in-out infinite; text-align:center; background:rgba(11,10,9,0.7); padding:10px 18px; border-radius:999px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .hint.hide{ display:none; }

  /* intro overlay (injected by JS, once per session) */
  .intro{ position:fixed; inset:0; z-index:100; background:#000; cursor:pointer; opacity:1; transition:opacity 1.25s ease; }
  .intro.fading{ opacity:0; pointer-events:none; }
  .intro video{ width:100%; height:100%; object-fit:contain; background:#000; display:block; }
  .intro .intro-vignette{ position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse 90% 80% at 50% 50%, transparent 55%, rgba(0,0,0,0.6) 100%); }
  .intro .intro-label{ position:absolute; bottom:34px; left:50%; transform:translateX(-50%); font-family:var(--f-display); font-weight:700; font-size:22px; letter-spacing:0.22em; color:var(--yellow); animation:hintPulse 2.4s ease-in-out infinite; white-space:nowrap; }

  /* city toggle — mobile only */
  .citytoggle-scrim{ display:none; }
  .citytoggle{ position:fixed; left:50%; transform:translate(-50%, calc(-1 * var(--vv-lift))); bottom:22px; z-index:62; display:none; align-items:center; gap:6px; padding:6px; background:rgba(14,13,11,0.78); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.12); border-radius:999px; }
  .citytoggle button{ font-family:var(--f-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; padding:11px 20px; border:0; border-radius:999px; background:transparent; color:rgba(255,255,255,0.5); cursor:pointer; transition:all .35s ease; }
  .citytoggle button.on{ color:#141210; background:var(--toggle-acc,#e6d33b); font-weight:700; }

  /* ===== MOBILE: one city at a time, tap to switch ===== */
  @media (max-width: 860px){
    .stage{ display:block; }
    .panel{ position:absolute; inset:0; width:100%; transition:opacity .8s ease, transform .8s cubic-bezier(0.16,1,0.3,1); }
    .panel .edge, .panel .rail{ display:none; }
    .seam{ display:none; }
    .stage[data-mobile-city="ant"] .panel[data-id="kor"]{ opacity:0; transform:translateX(36px); pointer-events:none; }
    .stage[data-mobile-city="kor"] .panel[data-id="ant"]{ opacity:0; transform:translateX(-36px); pointer-events:none; }
    .stage[data-mobile-city="ant"] .panel[data-id="ant"],
    .stage[data-mobile-city="kor"] .panel[data-id="kor"]{ opacity:1; transform:none; z-index:3; }
    .content{ padding-bottom:120px; }
    .face-bg{ background-size:cover; }
    .controls{ display:none; }
    .hint{ display:none; }
    .slot-inner{ flex-direction:column; padding-left:48px; }
    .slot-stage{ display:none; }
    /* city-switch pill sits at a fixed screen position while the programme
       list scrolls underneath it; fade the content out behind it so it never
       visually collides with a row of text. */
    .citytoggle-scrim{ position:fixed; left:0; right:0; bottom:0; height:118px; z-index:61; pointer-events:none; background:linear-gradient(to top, rgba(11,10,9,0.92), rgba(11,10,9,0)); display:block; transform:translateY(calc(-1 * var(--vv-lift))); }
    .citytoggle{ display:flex; }
    /* the "KLIK VOOR INFO" tap target was only ~16px tall (text line-height) —
       well under a comfortable touch target. Pad it out and pull the margin
       back in so the extra hit area doesn't push the row layout around. */
    .expand-hint{ padding:14px 6px; margin:-14px -6px; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage" data-mobile-city="ant">
    <!-- panels injected -->
  </div>

  <div class="seam" id="seam"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="controls">
    <div class="segwrap split-seg">
      <span class="label">SPLIT</span>
      <button class="seg" data-mech="follow">Hover</button>
      <button class="seg" data-mech="lock">Klik</button>
    </div>
  </div>

  <div class="hint" id="hint"></div>

  <div class="citytoggle-scrim"></div>
  <div class="citytoggle" id="citytoggle">
    <button data-city="ant">Antwerpen</button>
    <button data-city="kor">Kortrijk</button>
  </div>

<!-- BUILD:DATA --> <!-- build.mjs injects window.__SITE__ here for instant, SEO-friendly load -->
<script type="module">
import { renderPanels, labelSet } from './assets/render.mjs';
/* =========================================================================
   SITE_DATA — the festival content. Two sources:
     • production: build.mjs inlines it as window.__SITE__ and pre-renders the
       panels into the HTML (best for SEO + works offline).
     • development: if no inlined data, it is fetched from content/*.json.
   Those JSON files (festival.json, antwerpen.json, kortrijk.json,
   artiesten.json, nieuws.json) are exactly what the organizers
   (Vonk en Zonen) edit via the CMS at /admin.
   ========================================================================= */
let SITE_DATA = window.__SITE__ || null;

/* ---------- state + behaviour ---------- */
const stage = document.getElementById('stage');
const seam = document.getElementById('seam');
const hintEl = document.getElementById('hint');
const citytoggle = document.getElementById('citytoggle');
const COMPACTION = 0.5;
const EYE_STRENGTH = 1;   // 0–2, per design handoff
const mq = window.matchMedia('(max-width: 860px)');
const TOGGLE_ACC = { ant: '#8ec8d8', kor: '#e0703f' };

/* Mobile browsers report the layout viewport as the full page height even
   while their address bar is covering part of the screen — so a plain
   `position:fixed; bottom:22px` element can sit below the area actually
   visible until the user scrolls (which auto-hides the bar). Track the gap
   via visualViewport and feed it back as a CSS var the fixed elements read.
   Uses documentElement.clientHeight (not window.innerHeight, which some
   browsers report in a different pixel space) as the layout-viewport
   reference, and skips the correction while pinch-zoomed (scale > 1) so
   zooming in doesn't get misread as a toolbar change. */
if (window.visualViewport) {
  const vv = window.visualViewport;
  const updateVVLift = () => {
    const layoutH = document.documentElement.clientHeight;
    const lift = vv.scale <= 1.02 ? Math.max(0, layoutH - (vv.height + vv.offsetTop)) : 0;
    document.documentElement.style.setProperty('--vv-lift', lift + 'px');
  };
  vv.addEventListener('resize', updateVVLift);
  vv.addEventListener('scroll', updateVVLift);
  window.addEventListener('resize', updateVVLift);
  window.addEventListener('orientationchange', updateVVLift);
  updateVVLift();
  // some browsers settle their toolbar/viewport metrics a moment after load,
  // without firing a visualViewport event — re-check a couple of times to catch that.
  setTimeout(updateVVLift, 300);
  setTimeout(updateVVLift, 1200);
}

const state = { mechanic:'follow', active:null, hinted:false, mobileCity:'ant', introActive:false };
const panels = {}; // filled by boot() once content is rendered

function applySplit(){
  const c = COMPACTION;
  const growExpanded = 1 + c, growCompact = 1 - c;
  SITE_DATA.cities.forEach(city => {
    const el = panels[city.id];
    let grow = 1, compact = false;
    if (state.active !== null){
      if (state.active === city.id) grow = growExpanded;
      else { grow = growCompact; compact = true; }
    }
    el.style.flexGrow = grow;
    el.classList.toggle('compact', compact);
  });
  const seamPct = state.active === 'ant' ? (1+c)/2*100 : (state.active === 'kor' ? (1-c)/2*100 : 50);
  seam.style.left = seamPct + '%';
}

let flareT;
function flare(){
  seam.classList.add('flare');
  clearTimeout(flareT);
  flareT = setTimeout(()=> seam.classList.remove('flare'), 850);
}

function setActive(id){
  if (state.active === id) return;
  state.active = id;
  flare();
  if (!state.hinted){ state.hinted = true; hintEl.classList.add('hide'); }
  applySplit();
}

/* ---------- the living eye: iris follows the cursor, lids blink ---------- */
let lastMouse = 0;
function eyeEls(){ return [...stage.querySelectorAll('[data-eye]')]; }

function moveIrises(fn){
  eyeEls().forEach(eye => {
    const iris = eye.querySelector('[data-iris]');
    if (!iris) return;
    const [dx, dy] = fn(eye);
    iris.style.transform = 'translate(' + dx + '%, ' + dy + '%)';
  });
}

function followCursor(ev){
  lastMouse = Date.now();
  moveIrises(eye => {
    const r = eye.getBoundingClientRect();
    if (!r.width) return [0, 0];
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const dx = Math.max(-1, Math.min(1, (ev.clientX - cx) / (window.innerWidth * 0.35))) * 9 * EYE_STRENGTH;
    const dy = Math.max(-1, Math.min(1, (ev.clientY - cy) / (window.innerHeight * 0.5))) * 6 * EYE_STRENGTH;
    return [dx, dy];
  });
}

function startEyeLife(){
  const setFrame = f => eyeEls().forEach(e => { e.dataset.frame = f; });
  const blink = () => {
    const seq = Math.random() < 0.18 ? [1,2,3,2,1,0,1,2,3,2,1,0] : [1,2,3,2,1,0];
    let t = 0;
    seq.forEach(f => { setTimeout(() => setFrame(f), t); t += f === 3 ? 120 : 55; });
    setTimeout(blink, 2600 + Math.random() * 4800);
  };
  setTimeout(blink, 1400);
  // with no cursor activity the eye wanders on its own
  setInterval(() => {
    if (Date.now() - lastMouse > 3500) {
      const dx = (Math.random() * 2 - 1) * 7, dy = (Math.random() * 2 - 1) * 4;
      moveIrises(() => [dx, dy]);
    }
  }, 2800);
}

/* ---------- hero figure parallax: slides up + fades with the hero ---------- */
function attachFigureParallax(){
  stage.querySelectorAll('.panel').forEach(panel => {
    const scroll = panel.querySelector('[data-scroll]');
    const fig = panel.querySelector('[data-fig]');
    if (!scroll || !fig) return;
    let ticking = false;
    scroll.addEventListener('scroll', () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        ticking = false;
        const y = scroll.scrollTop;
        const vh = window.innerHeight || 900;
        if (y > vh * 1.4) return; // long past the hero — nothing left to animate
        fig.style.transform = 'translateY(' + (-y * 0.55) + 'px)';
        fig.style.opacity = (0.9 * Math.max(0, 1 - y / (vh * 0.45))).toFixed(3);
      });
    }, { passive: true });
  });
}

/* ---------- intro overlay: painted opener, once per session ---------- */
function maybeShowIntro(labels){
  let seen = false;
  try { seen = sessionStorage.getItem('spoken-intro-v3') === '1'; } catch (e) {}
  if (seen) return;
  state.introActive = true;
  const el = document.createElement('div');
  el.className = 'intro';
  el.innerHTML =
    '<video autoplay muted playsinline src="assets/media/intro.mp4"></video>' +
    '<div class="intro-vignette"></div>' +
    '<div class="intro-label"></div>';
  el.querySelector('.intro-label').textContent = labels.introKnop;
  document.body.appendChild(el);
  const video = el.querySelector('video');
  if (video.play) video.play().catch(() => {});
  let done = false;
  const dismiss = () => {
    if (done) return;
    done = true;
    try { sessionStorage.setItem('spoken-intro-v3', '1'); } catch (e) {}
    el.classList.add('fading');
    setTimeout(() => { el.remove(); state.introActive = false; }, 1300);
  };
  el.addEventListener('click', dismiss);
  video.addEventListener('ended', dismiss);
}

/* desktop hover-follow (+ eye tracking) */
stage.addEventListener('mousemove', e => {
  followCursor(e);
  if (mq.matches || state.mechanic !== 'follow' || state.introActive) return;
  const w = window.innerWidth, x = e.clientX, c = COMPACTION, buf = 10, a = state.active;
  let z;
  if (a === 'ant') z = x > ((1+c)/2)*w + buf ? 'kor' : 'ant';
  else if (a === 'kor') z = x < ((1-c)/2)*w - buf ? 'ant' : 'kor';
  else z = x < w*0.46 ? 'ant' : (x > w*0.54 ? 'kor' : null);
  setActive(z);
});
stage.addEventListener('mouseleave', () => {
  if (!mq.matches && state.mechanic === 'follow') setActive(null);
});

/* clicks: expand-all, slot toggling, click-lock (delegated) */
stage.addEventListener('click', e => {
  const toggleAll = e.target.closest('[data-toggle-all]');
  if (toggleAll){
    const panel = toggleAll.closest('.panel');
    const bodies = panel.querySelectorAll('.slot-body');
    const anyClosed = [...bodies].some(b => !b.classList.contains('open'));
    bodies.forEach(b => b.classList.toggle('open', anyClosed));
    panel.querySelectorAll('.slot-chev').forEach(c => c.textContent = anyClosed ? '–' : '+');
    const lbl = labelSet(SITE_DATA || {});
    toggleAll.textContent = anyClosed ? lbl.verbergInfo : lbl.klikVoorInfo;
    return;
  }
  const row = e.target.closest('.slot-row');
  if (row){
    const key = row.getAttribute('data-toggle');
    const body = stage.querySelector('[data-body="'+key+'"]');
    const chev = stage.querySelector('[data-chev="'+key+'"]');
    const open = body.classList.toggle('open');
    chev.textContent = open ? '–' : '+';
    return;
  }
  if (mq.matches || state.mechanic !== 'lock') return;
  const panel = e.target.closest('.panel');
  if (!panel) return;
  const id = panel.getAttribute('data-id');
  setActive(state.active === id ? null : id);
});

/* mobile city toggle */
function setMobileCity(id){
  state.mobileCity = id;
  stage.setAttribute('data-mobile-city', id);
  citytoggle.style.setProperty('--toggle-acc', TOGGLE_ACC[id] || '#e6d33b');
  citytoggle.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.city === id));
}
citytoggle.querySelectorAll('button').forEach(b => {
  b.addEventListener('click', () => setMobileCity(b.dataset.city));
});

/* split-mode control */
document.querySelectorAll('[data-mech]').forEach(b => b.addEventListener('click', () => {
  state.mechanic = b.dataset.mech; state.active = null; applySplit(); syncHint();
  document.querySelectorAll('[data-mech]').forEach(x => x.classList.toggle('on', x === b));
}));

function syncHint(){
  if (mq.matches || state.hinted || state.introActive){ hintEl.classList.add('hide'); return; }
  hintEl.classList.remove('hide');
  const lbl = labelSet(SITE_DATA || {});
  hintEl.textContent = state.mechanic === 'follow' ? lbl.hintBeweeg : lbl.hintKlik;
}
mq.addEventListener('change', () => { state.active = null; applySplit(); syncHint(); });

/* boot — load the content files (festival, both cities, artists, news), then render + init */
document.querySelector('[data-mech="follow"]').classList.add('on');

async function boot(){
  // production: build.mjs already pre-rendered the panels and inlined the data.
  const preRendered = stage.querySelector('.panel');

  if (!SITE_DATA) {
    const getJson = async (name, optional) => {
      try {
        const res = await fetch('content/' + name, { cache: 'no-store' });
        if (!res.ok) throw new Error(name + ': HTTP ' + res.status);
        return res.json();
      } catch (err) {
        if (optional) return null;
        throw err;
      }
    };
    try {
      const [fest, ant, kor, art, nws] = await Promise.all([
        getJson('festival.json'), getJson('antwerpen.json'), getJson('kortrijk.json'),
        getJson('artiesten.json', true), getJson('nieuws.json', true),
      ]);
      SITE_DATA = {
        festival: fest.festival, labels: fest.labels || {},
        days: fest.days || [],
        cities: [ant, kor],
        artists: (art && art.artists) || [],
        news: nws || { posts: [], posters: [] },
      };
    } catch (err) {
      stage.innerHTML = '<div style="margin:auto;max-width:46ch;padding:40px;font-family:var(--f-mono);font-size:13px;line-height:1.7;color:#bbb;text-align:center;">' +
        'Kon de inhoud uit <b>content/</b> niet laden.<br><br>Open deze site via een (lokale) webserver, niet rechtstreeks vanaf het bestand. ' +
        'Bv. in deze map:<br><code style="color:#e6d33b;">python -m http.server</code><br>en ga naar <code style="color:#e6d33b;">http://localhost:8000</code>.<br><br>' +
        '<span style="color:#666;">(' + err.message + ')</span></div>';
      return;
    }
  }

  if (!preRendered) stage.innerHTML = renderPanels(SITE_DATA);
  SITE_DATA.cities.forEach(c => { panels[c.id] = stage.querySelector('.panel[data-id="'+c.id+'"]'); });

  // mobile city-switch labels come from the content, not hardcoded text
  citytoggle.querySelectorAll('button').forEach(b => {
    const c = SITE_DATA.cities.find(x => x.id === b.dataset.city);
    if (c) b.textContent = c.name;
  });

  const labels = labelSet(SITE_DATA);
  maybeShowIntro(labels);
  startEyeLife();
  attachFigureParallax();
  setMobileCity('ant');
  applySplit();
  syncHint();
}
boot();
</script>
</body>
</html>
