<!DOCTYPE html>
<html lang="nl" data-theme="seance" data-mechanic="follow">

<title>SPOKEN · Festival — Antwerpen & Kortrijk · 31 OKT – 01 NOV 2026</title>

<meta name="theme-color" content="#050406">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Oswald:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --f-display:'IM Fell English', Georgia, serif;
    --f-body:'Space Grotesk', sans-serif;
    --f-mono:'Space Mono', monospace;
    --disp-tr:none; --disp-sp:0.012em; --disp-wt:400; --radius:2px;
    /* how far the visible screen falls short of the layout viewport (mobile
       browser address bar) — kept in sync by JS via the visualViewport API,
       so fixed bottom elements can compensate. See citytoggle. */
    --vv-lift:0px;
  }
  html[data-theme="static"]{
    --f-display:'Oswald', sans-serif;
    --disp-tr:uppercase; --disp-sp:0.035em; --disp-wt:700; --radius:0px;
  }
  html, body { margin:0; height:100%; background:#050406; }
  * { box-sizing:border-box; }
  body{ font-family:var(--f-body); color:#fff; overflow:hidden; }
  ::-webkit-scrollbar { width:7px; height:7px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.14); border-radius:4px; }
  ::-webkit-scrollbar-track { background:transparent; }

  @keyframes fogA { 0%{transform:translate(-6%,-4%) scale(1.1);} 50%{transform:translate(8%,6%) scale(1.25);} 100%{transform:translate(-6%,-4%) scale(1.1);} }
  @keyframes fogB { 0%{transform:translate(5%,8%) scale(1.2);} 50%{transform:translate(-7%,-6%) scale(1.05);} 100%{transform:translate(5%,8%) scale(1.2);} }
  @keyframes hintPulse { 0%,100%{opacity:0.35;} 50%{opacity:0.85;} }
  @keyframes wisp { 0%{transform:translateY(30px) scale(0.8); opacity:0;} 18%{opacity:0.55;} 82%{opacity:0.4;} 100%{transform:translateY(-160px) translateX(24px) scale(1.4); opacity:0;} }
  @keyframes echoDrift { 0%,100%{transform:translate(0,0); opacity:0.16;} 50%{transform:translate(7px,-5px); opacity:0.30;} }
  @keyframes echoDrift2 { 0%,100%{transform:translate(0,0); opacity:0.08;} 50%{transform:translate(-10px,7px); opacity:0.20;} }
  @keyframes haunt { 0%,100%{opacity:0;} 46%{opacity:0;} 47%{opacity:0.40;} 48%{opacity:0;} 49%{opacity:0.22;} 50%{opacity:0;} 78%{opacity:0;} 78.5%{opacity:0.45;} 79%{opacity:0;} }
  @keyframes flicker { 0%,100%{opacity:1;} 91%{opacity:1;} 92%{opacity:0.35;} 93%{opacity:1;} 95%{opacity:0.6;} 96%{opacity:1;} }
  @keyframes grainShift { 0%{transform:translate(0,0);} 20%{transform:translate(-12%,6%);} 40%{transform:translate(8%,-10%);} 60%{transform:translate(-6%,10%);} 80%{transform:translate(10%,4%);} 100%{transform:translate(0,0);} }
  @keyframes breathe { 0%,100%{opacity:0.75;} 50%{opacity:1;} }
  @keyframes rise { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .stage{ position:fixed; inset:0; display:flex; overflow:hidden; background:#050406; }

  .panel{
    flex:1 1 0%; min-width:0; position:relative; overflow:hidden;
    background:var(--bg); color:var(--fg);
    transition:flex-grow 1.25s cubic-bezier(0.16,1,0.3,1);
  }
  .fog-a, .fog-b{ position:absolute; inset:-30%; z-index:0; pointer-events:none; }
  .fog-a{ background:radial-gradient(45% 45% at 35% 30%, var(--glow), transparent 70%); animation:fogA 26s ease-in-out infinite, breathe 11s ease-in-out infinite; }
  .fog-b{ background:radial-gradient(40% 40% at 70% 75%, var(--glow), transparent 70%); animation:fogB 34s ease-in-out infinite, breathe 14s ease-in-out infinite; }
  .wisps{ position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .wisps span{ position:absolute; border-radius:50%; background:radial-gradient(circle, var(--acc), transparent 65%); opacity:0; }
  html[data-theme="static"] .wisps{ opacity:0; }

  .scroll{ position:absolute; inset:0; z-index:2; overflow-y:auto; overflow-x:hidden; }
  .content{ min-height:100%; padding:clamp(34px,4.2vw,76px); display:flex; flex-direction:column; gap:clamp(54px,6vw,96px); }

  .eyebrow{ display:flex; align-items:center; gap:14px; font-family:var(--f-mono); font-size:11px; letter-spacing:0.32em; text-transform:uppercase; color:var(--acc); }
  .hero-subtitle{ margin:0; font-style:italic; font-size:clamp(17px,1.8vw,24px); color:var(--fg); max-width:36ch; line-height:1.4; text-shadow:0 0 20px var(--glow); }
  .eyebrow .line{ flex:1; height:1px; background:var(--line); }
  .eyebrow .yr{ color:var(--mut); }
  .eyebrow .mark{ animation:flicker 7s linear infinite; }

  .hero{ min-height:62vh; display:flex; flex-direction:column; justify-content:flex-end; gap:22px; padding-bottom:8px; }
  .title-wrap{ position:relative; }
  .title-echo, .title{
    margin:0; font-family:var(--f-display); text-transform:var(--disp-tr); letter-spacing:var(--disp-sp);
    font-weight:var(--disp-wt); font-size:clamp(54px,8vw,128px); line-height:0.92;
  }
  .title-echo{ position:absolute; inset:0; color:var(--acc); filter:blur(9px); animation:echoDrift 9s ease-in-out infinite; pointer-events:none; }
  .title-echo.two{ filter:blur(17px); opacity:0.12; animation:echoDrift2 13s ease-in-out infinite; }
  .title{ position:relative; text-shadow:0 0 48px var(--glow), 0 0 96px var(--glow); }
  .tagline{ margin:0; font-size:clamp(16px,1.5vw,21px); color:var(--mut); max-width:34ch; line-height:1.45; }
  .meta-row{ display:flex; flex-wrap:wrap; align-items:center; gap:18px 26px; margin-top:8px; font-family:var(--f-mono); font-size:12px; letter-spacing:0.06em; color:var(--fg); }
  .meta-row .dot{ width:5px; height:5px; border-radius:50%; background:var(--acc); }
  .meta-row .venue{ color:var(--mut); }
  .cta-row{ display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-top:14px; }
  .btn-tickets{ display:inline-flex; align-items:center; gap:10px; padding:13px 24px; border-radius:var(--radius); background:var(--acc); color:#0a0a0c; font-family:var(--f-mono); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; cursor:pointer; border:0; text-decoration:none; transition:filter .25s ease, transform .25s ease; }
  .btn-tickets:hover{ filter:brightness(1.12); transform:translateY(-1px); }
  .twin{ font-family:var(--f-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--mut); }

  .sec-head{ display:flex; align-items:baseline; gap:16px; margin-bottom:26px; }
  .sec-head h2{ margin:0; font-family:var(--f-display); text-transform:var(--disp-tr); letter-spacing:var(--disp-sp); font-weight:var(--disp-wt); font-size:clamp(28px,3.2vw,46px); line-height:1; }
  .sec-head .line{ flex:1; height:1px; background:var(--line); }
  .expand-hint{ font-family:var(--f-mono); font-size:11px; letter-spacing:0.2em; color:var(--mut); cursor:pointer; transition:color .2s ease; }
  .expand-hint:hover{ color:var(--acc); }

  .day{ margin-bottom:34px; }
  .day-head{ display:flex; align-items:center; gap:12px; margin-bottom:6px; font-family:var(--f-mono); font-size:11px; letter-spacing:0.24em; text-transform:uppercase; color:var(--acc); }
  .day-head .date{ color:var(--mut); }
  .day-end{ height:1px; background:var(--line); }

  .slot-row{ display:flex; align-items:center; gap:18px; padding:18px 4px; border-top:1px solid var(--line); cursor:pointer; }
  .slot-time{ font-family:var(--f-mono); font-size:13px; color:var(--mut); min-width:48px; }
  .slot-artist{ flex:1; font-family:var(--f-display); text-transform:var(--disp-tr); letter-spacing:var(--disp-sp); font-weight:var(--disp-wt); font-size:clamp(20px,2vw,30px); line-height:1.05; }
  .slot-stage{ font-family:var(--f-mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--mut); text-align:right; max-width:13ch; }
  .slot-chev{ font-family:var(--f-mono); font-size:18px; line-height:1; color:var(--acc); width:18px; text-align:center; }
  .slot-body{ overflow:hidden; max-height:0; opacity:0; transition:max-height 0.7s cubic-bezier(0.22,0.61,0.36,1), opacity 0.5s ease; }
  .slot-body.open{ max-height:360px; opacity:1; }
  .slot-inner{ display:flex; gap:22px; padding:6px 4px 26px 66px; align-items:flex-start; }
  .slot-photo{ width:128px; height:96px; flex-shrink:0; border:1px solid var(--line); border-radius:var(--radius); background-image:repeating-linear-gradient(45deg, var(--line) 0 1px, transparent 1px 9px); display:flex; align-items:flex-end; padding:7px; font-family:var(--f-mono); font-size:8px; letter-spacing:0.1em; color:var(--mut); }
  .slot-photo.has-img{ padding:0; overflow:hidden; background:none; }
  .slot-photo img{ width:100%; height:100%; object-fit:cover; display:block; filter:saturate(0.85) contrast(1.05); }
  .slot-genre{ font-family:var(--f-mono); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--acc); margin-bottom:9px; }
  .slot-blurb{ margin:0; font-size:15px; line-height:1.6; color:var(--fg); max-width:48ch; }
  .slot-bio{ margin:10px 0 0; font-size:13.5px; line-height:1.55; color:var(--mut); max-width:48ch; }
  .slot-artist-link{ display:inline-block; margin-top:10px; font-family:var(--f-mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--acc); text-decoration:none; }
  .slot-artist-link:hover{ text-decoration:underline; }

  .news-item{ padding:20px 0; border-top:1px solid var(--line); }
  .news-date{ font-family:var(--f-mono); font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--mut); }
  .news-title{ margin:8px 0 0; font-family:var(--f-display); text-transform:var(--disp-tr); letter-spacing:var(--disp-sp); font-weight:var(--disp-wt); font-size:clamp(20px,2.2vw,30px); line-height:1.1; }
  .news-par{ margin:10px 0 0; font-size:15px; line-height:1.6; color:var(--fg); max-width:60ch; }
  .news-img{ margin-top:14px; width:100%; max-width:440px; border:1px solid var(--line); border-radius:var(--radius); display:block; }

  .posters{ display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:18px; }
  .poster{ margin:0; }
  .poster img{ width:100%; display:block; border:1px solid var(--line); border-radius:var(--radius); }
  .poster figcaption{ margin-top:8px; font-family:var(--f-mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--mut); }

  .info-grid{ display:flex; flex-wrap:wrap; gap:40px; }
  .info-text{ flex:2 1 320px; min-width:260px; display:flex; flex-direction:column; gap:16px; }
  .info-text p{ margin:0; font-size:16px; line-height:1.65; color:var(--fg); }
  .info-facts{ flex:1 1 200px; min-width:180px; display:flex; flex-direction:column; }
  .fact{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:13px 0; border-top:1px solid var(--line); font-family:var(--f-mono); font-size:12px; }
  .fact .k{ color:var(--mut); letter-spacing:0.08em; text-transform:uppercase; }
  .fact .v{ color:var(--acc); text-align:right; }

  .practical{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .practical .cell{ background:var(--bg); padding:22px 20px; display:flex; flex-direction:column; gap:8px; }
  .practical .k{ font-family:var(--f-mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--acc); }
  .practical .v{ font-size:15px; line-height:1.45; color:var(--fg); }

  .ticket{ display:flex; align-items:center; gap:20px; padding:22px 26px; border:1px solid var(--line); border-radius:var(--radius); }
  .ticket .tier{ font-family:var(--f-display); text-transform:var(--disp-tr); letter-spacing:var(--disp-sp); font-weight:var(--disp-wt); font-size:clamp(20px,1.9vw,26px); line-height:1; }
  .ticket .note{ font-family:var(--f-mono); font-size:11px; letter-spacing:0.08em; color:var(--mut); margin-top:7px; }
  .ticket .price{ font-family:var(--f-mono); font-size:22px; color:var(--fg); }
  .ticket .buy{ padding:11px 20px; border-radius:var(--radius); border:1px solid var(--acc); color:var(--acc); background:transparent; font-family:var(--f-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; cursor:pointer; transition:background .25s ease, color .25s ease; }
  .ticket .buy:hover{ background:var(--acc); color:#0a0a0c; }
  .tickets-list{ display:flex; flex-direction:column; gap:14px; }
  .foot{ margin-top:48px; padding-top:22px; border-top:1px solid var(--line); display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; font-family:var(--f-mono); font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--mut); }

  .edge{ position:absolute; top:0; bottom:0; width:140px; z-index:4; pointer-events:none; }
  .panel[data-side="left"] .edge{ right:-1px; background:linear-gradient(90deg, transparent, var(--glow)); }
  .panel[data-side="right"] .edge{ left:-1px; background:linear-gradient(270deg, transparent, var(--glow)); }

  .rail{ position:absolute; inset:0; z-index:5; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:38px 0; transition:opacity 0.7s ease; opacity:0; pointer-events:none; }
  .panel.compact .rail{ opacity:1; pointer-events:auto; }
  .rail .mark{ font-family:var(--f-mono); font-size:10px; letter-spacing:0.3em; color:var(--acc); }
  .rail .mid{ flex:1; display:flex; align-items:center; justify-content:center; }
  .rail .vname{ font-family:var(--f-display); text-transform:var(--disp-tr); letter-spacing:0.08em; font-weight:var(--disp-wt); font-size:clamp(30px,3.4vw,52px); white-space:nowrap; writing-mode:vertical-rl; text-shadow:0 0 26px var(--glow); animation:flicker 5s linear infinite; }
  .rail .botcue{ display:flex; flex-direction:column; align-items:center; gap:10px; font-family:var(--f-mono); font-size:10px; letter-spacing:0.16em; color:var(--mut); }
  .rail .botcue .cue{ color:var(--acc); }

  .seam{ position:absolute; top:0; bottom:0; z-index:45; pointer-events:none; transform:translateX(-50%);
    background:linear-gradient(90deg, transparent, oklch(0.85 0.09 188 / 0.45) 30%, oklch(0.96 0.03 150 / 0.78) 50%, oklch(0.74 0.145 48 / 0.45) 70%, transparent);
    filter:blur(9px); width:64px; opacity:0.34;
    transition:left 1.25s cubic-bezier(0.16,1,0.3,1), opacity 0.55s ease, width 0.7s ease, filter 0.7s ease; }
  .seam.flare{ filter:blur(6px); width:150px; opacity:0.95; }

  .vignette{ position:absolute; inset:0; z-index:40; pointer-events:none; background:radial-gradient(ellipse 76% 66% at 50% 42%, transparent 40%, rgba(0,0,0,0.74) 100%); }
  .haunt{ position:absolute; inset:0; z-index:42; pointer-events:none; background:#000; opacity:0; animation:haunt 14s linear infinite; }
  .grain{ position:absolute; inset:-50%; z-index:41; pointer-events:none; opacity:0.07; mix-blend-mode:soft-light; background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22 numOctaves=%222%22 stitchTiles=%22stitch%22/></filter><rect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/></svg>'); background-size:160px 160px; animation:grainShift 1.4s steps(4) infinite; }

  .controls{ position:absolute; top:18px; left:50%; transform:translateX(-50%); z-index:60; display:flex; gap:12px; align-items:center; }
  .segwrap{ display:flex; align-items:center; background:rgba(14,14,18,0.72); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.12); border-radius:999px; overflow:hidden; }
  .segwrap .label{ padding:0 12px 0 14px; font-family:var(--f-mono); font-size:9px; letter-spacing:0.18em; color:rgba(255,255,255,0.35); }
  .seg{ font-family:var(--f-mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; padding:8px 14px; border:0; cursor:pointer; background:transparent; color:rgba(255,255,255,0.45); transition:all .3s ease; }
  .seg.on{ background:rgba(255,255,255,0.13); color:#fff; }

  .hint{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:55; pointer-events:none; font-family:var(--f-mono); font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color:rgba(255,255,255,0.7); animation:hintPulse 2.6s ease-in-out infinite; text-align:center; }
  .hint.hide{ display:none; }

  /* palette picker — top right */
  .palettebar{ position:absolute; top:18px; right:18px; z-index:61; }
  .palettebtn{ display:flex; align-items:center; gap:9px; padding:8px 13px; background:rgba(14,14,18,0.72); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.12); border-radius:999px; cursor:pointer; font-family:var(--f-mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:rgba(255,255,255,0.72); }
  .palettebtn .caret{ color:rgba(255,255,255,0.4); font-size:9px; }
  .pdots{ display:inline-flex; gap:4px; }
  .pdots i{ width:9px; height:9px; border-radius:50%; display:inline-block; box-shadow:0 0 7px currentColor; }
  .palettepop{ position:absolute; top:46px; right:0; width:236px; max-height:72vh; overflow-y:auto; padding:7px; background:rgba(10,10,14,0.92); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.12); border-radius:14px; box-shadow:0 24px 60px rgba(0,0,0,0.6); flex-direction:column; gap:2px; display:none; }
  .palettebar.open .palettepop{ display:flex; animation:rise .35s ease both; }
  .palrow{ display:flex; align-items:center; gap:12px; padding:9px 11px; border-radius:9px; cursor:pointer; transition:background .2s ease; }
  .palrow:hover{ background:rgba(255,255,255,0.06); }
  .palrow.on{ background:rgba(255,255,255,0.11); }
  .palrow .sw{ display:inline-flex; gap:5px; }
  .palrow .sw i{ width:14px; height:14px; border-radius:50%; box-shadow:0 0 8px currentColor; }
  .palrow .nm{ font-family:var(--f-mono); font-size:11px; letter-spacing:0.1em; color:rgba(255,255,255,0.85); }

  /* city toggle — mobile only */
  .citytoggle-scrim{ display:none; }
  .citytoggle{ position:fixed; left:50%; transform:translate(-50%, calc(-1 * var(--vv-lift))); bottom:22px; z-index:62; display:none; align-items:center; gap:6px; padding:6px; background:rgba(14,14,18,0.78); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.12); border-radius:999px; }
  .citytoggle button{ font-family:var(--f-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; padding:11px 20px; border:0; border-radius:999px; background:transparent; color:rgba(255,255,255,0.5); cursor:pointer; transition:all .35s ease; }
  .citytoggle button.on{ color:#0a0a0c; background:var(--toggle-acc,#fff); font-weight:700; }

  /* ===== MOBILE: one city at a time, tap to switch ===== */
  @media (max-width: 860px){
    .stage{ display:block; }
    .panel{ position:absolute; inset:0; width:100%; transition:opacity .8s ease, transform .8s cubic-bezier(0.16,1,0.3,1); }
    .panel .edge, .panel .rail{ display:none; }
    .seam{ display:none; }
    .stage[data-mobile-city="ant"] .panel[data-id="kor"]{ opacity:0; transform:translateX(36px); pointer-events:none; }
    .stage[data-mobile-city="kor"] .panel[data-id="ant"]{ opacity:0; transform:translateX(-36px); pointer-events:none; }
    .stage[data-mobile-city="ant"] .panel[data-id="ant"],
    .stage[data-mobile-city="kor"] .panel[data-id="kor"]{ opacity:1; transform:none; z-index:3; }
    .content{ padding-bottom:120px; }

    /* top controls: was centered LOOK toggle + right-aligned palette picker,
       which measured out to a ~73px overlap at 375px width. Pin LOOK to the
       left and shrink the palette button to icon-only so both fit with room
       to spare. */
    .controls{ left:18px; right:auto; transform:none; }
    .palettebtn #palettename{ display:none; }
    .palettebtn{ padding:8px 10px; }

    .controls .split-seg{ display:none; }

    /* city-switch pill sits at a fixed screen position while the programme
       list scrolls underneath it; fade the content out behind it so it never
       visually collides with a row of text. */
    .citytoggle-scrim{ position:fixed; left:0; right:0; bottom:0; height:118px; z-index:61; pointer-events:none; background:linear-gradient(to top, rgba(5,4,6,0.92), rgba(5,4,6,0)); display:block; transform:translateY(calc(-1 * var(--vv-lift))); }
    .citytoggle{ display:flex; }
    .hint{ display:none; }
    .slot-inner{ flex-direction:column; padding-left:48px; }
    .slot-stage{ display:none; }

    /* the "KLIK VOOR INFO" tap target was only ~16px tall (text line-height) —
       well under a comfortable touch target. Pad it out and pull the margin
       back in so the extra hit area doesn't push the row layout around. */
    .expand-hint{ padding:14px 6px; margin:-14px -6px; }
  }
</style>

<!-- BUILD:DATA --> <!-- build.mjs injects window.__SITE__ here for instant, SEO-friendly load -->
<script type="module">
import { renderPanels, labelSet } from './assets/render.mjs';
/* =========================================================================
   SITE_DATA — the festival content. NO LONGER hard-coded here. Two sources:
     • production: build.mjs inlines it as window.__SITE__ and pre-renders the
       panels into the HTML (best for SEO + works offline).
     • development: if no inlined data, it is fetched from content/*.json.
   Those JSON files (festival.json, antwerpen.json, kortrijk.json,
   artiesten.json, nieuws.json) are exactly what the organizers
   (Vonk en Zonen) edit via the CMS at /admin.
   ========================================================================= */
let SITE_DATA = window.__SITE__ || null;

/* =========================================================================
   PALETTES — theme presets the organizers can click through (top-right picker).
   Theme is separate from content: each palette only sets colour. Per city we
   define bg / fg / mut / acc / line; `glow` (accent halo) and the seam gradient
   are derived from `acc` + `mid`. ant = cold city, kor = warm/contrast city.
   In the CMS this becomes a single "site theme" setting.
   ========================================================================= */
const PALETTES = [
  { id:'spectraal', name:'Spectraal', mid:'oklch(0.96 0.03 150)',
    ant:{ bg:'oklch(0.14 0.022 262)', fg:'oklch(0.91 0.012 240)', mut:'oklch(0.58 0.022 250)', acc:'oklch(0.85 0.09 188)',  line:'oklch(0.27 0.02 258)' },
    kor:{ bg:'oklch(0.14 0.024 38)',  fg:'oklch(0.92 0.012 68)',  mut:'oklch(0.58 0.03 50)',   acc:'oklch(0.74 0.145 48)',  line:'oklch(0.27 0.024 44)' } },

  { id:'necropolis', name:'Necropolis', mid:'oklch(0.88 0.05 110)',
    ant:{ bg:'oklch(0.14 0.025 150)', fg:'oklch(0.90 0.015 135)', mut:'oklch(0.57 0.03 145)',  acc:'oklch(0.80 0.15 145)',  line:'oklch(0.27 0.025 150)' },
    kor:{ bg:'oklch(0.14 0.03 22)',   fg:'oklch(0.90 0.02 30)',   mut:'oklch(0.56 0.04 25)',   acc:'oklch(0.52 0.14 25)',   line:'oklch(0.27 0.03 22)' } },

  { id:'maanlicht', name:'Maanlicht', mid:'oklch(0.97 0.012 240)',
    ant:{ bg:'oklch(0.15 0.02 250)',  fg:'oklch(0.93 0.01 240)',  mut:'oklch(0.60 0.02 245)',  acc:'oklch(0.88 0.05 240)',  line:'oklch(0.28 0.018 250)' },
    kor:{ bg:'oklch(0.15 0.022 70)',  fg:'oklch(0.93 0.012 80)',  mut:'oklch(0.60 0.03 72)',   acc:'oklch(0.82 0.13 80)',   line:'oklch(0.28 0.022 68)' } },

  { id:'vagevuur', name:'Vagevuur', mid:'oklch(0.90 0.06 80)',
    ant:{ bg:'oklch(0.14 0.025 250)', fg:'oklch(0.91 0.012 235)', mut:'oklch(0.58 0.025 240)', acc:'oklch(0.72 0.10 235)',  line:'oklch(0.27 0.022 250)' },
    kor:{ bg:'oklch(0.14 0.026 40)',  fg:'oklch(0.92 0.014 55)',  mut:'oklch(0.58 0.035 45)',  acc:'oklch(0.70 0.18 40)',   line:'oklch(0.27 0.026 40)' } },

  { id:'ectoplasma', name:'Ectoplasma', mid:'oklch(0.92 0.06 200)',
    ant:{ bg:'oklch(0.14 0.03 165)',  fg:'oklch(0.91 0.015 155)', mut:'oklch(0.58 0.03 160)',  acc:'oklch(0.86 0.16 160)',  line:'oklch(0.27 0.028 165)' },
    kor:{ bg:'oklch(0.14 0.03 345)',  fg:'oklch(0.91 0.018 340)', mut:'oklch(0.58 0.04 348)',  acc:'oklch(0.68 0.20 350)',  line:'oklch(0.27 0.03 345)' } },

  { id:'nevel', name:'Nevel', mid:'oklch(0.90 0.02 160)',
    ant:{ bg:'oklch(0.15 0.012 240)', fg:'oklch(0.90 0.008 230)', mut:'oklch(0.58 0.012 240)', acc:'oklch(0.80 0.05 200)',  line:'oklch(0.28 0.012 245)' },
    kor:{ bg:'oklch(0.15 0.014 50)',  fg:'oklch(0.90 0.01 60)',   mut:'oklch(0.58 0.018 52)',  acc:'oklch(0.66 0.08 50)',   line:'oklch(0.28 0.014 48)' } },

  { id:'nachtschade', name:'Nachtschade', mid:'oklch(0.86 0.07 250)',
    ant:{ bg:'oklch(0.14 0.025 220)', fg:'oklch(0.91 0.012 210)', mut:'oklch(0.58 0.025 215)', acc:'oklch(0.78 0.11 195)',  line:'oklch(0.27 0.022 220)' },
    kor:{ bg:'oklch(0.14 0.03 300)',  fg:'oklch(0.90 0.018 300)', mut:'oklch(0.57 0.035 300)', acc:'oklch(0.62 0.16 300)',  line:'oklch(0.27 0.03 300)' } },

  { id:'wierook', name:'Wierook', mid:'oklch(0.92 0.05 120)',
    ant:{ bg:'oklch(0.14 0.022 170)', fg:'oklch(0.91 0.012 160)', mut:'oklch(0.58 0.025 165)', acc:'oklch(0.78 0.11 165)',  line:'oklch(0.27 0.022 170)' },
    kor:{ bg:'oklch(0.15 0.022 65)',  fg:'oklch(0.92 0.012 72)',  mut:'oklch(0.59 0.03 66)',   acc:'oklch(0.78 0.14 70)',   line:'oklch(0.28 0.022 64)' } },

  { id:'as', name:'As', mid:'oklch(0.88 0.03 60)',
    ant:{ bg:'oklch(0.145 0.012 250)',fg:'oklch(0.89 0.008 240)', mut:'oklch(0.57 0.012 245)', acc:'oklch(0.74 0.04 240)',  line:'oklch(0.27 0.012 250)' },
    kor:{ bg:'oklch(0.14 0.028 28)',  fg:'oklch(0.90 0.018 35)',  mut:'oklch(0.56 0.04 30)',   acc:'oklch(0.58 0.17 28)',   line:'oklch(0.27 0.03 26)' } },

  { id:'sintelmsvuur', name:'Sint-Elmsvuur', mid:'oklch(0.93 0.06 270)',
    ant:{ bg:'oklch(0.14 0.028 240)', fg:'oklch(0.92 0.014 225)', mut:'oklch(0.59 0.028 235)', acc:'oklch(0.85 0.13 210)',  line:'oklch(0.27 0.026 240)' },
    kor:{ bg:'oklch(0.14 0.03 320)',  fg:'oklch(0.91 0.018 325)', mut:'oklch(0.58 0.038 325)', acc:'oklch(0.72 0.17 330)',  line:'oklch(0.27 0.03 320)' } },
];

/* ---------- state + behaviour ---------- */
const stage = document.getElementById('stage');
const seam = document.getElementById('seam');
const hintEl = document.getElementById('hint');
const citytoggle = document.getElementById('citytoggle');
const COMPACTION = 0.5;
const mq = window.matchMedia('(max-width: 860px)');

/* Mobile browsers report the layout viewport as the full page height even
   while their address bar is covering part of the screen — so a plain
   `position:fixed; bottom:22px` element can sit below the area actually
   visible until the user scrolls (which auto-hides the bar). Track the gap
   via visualViewport and feed it back as a CSS var the fixed elements read.
   Uses documentElement.clientHeight (not window.innerHeight, which some
   browsers report in a different pixel space) as the layout-viewport
   reference, and skips the correction while pinch-zoomed (scale > 1) so
   zooming in doesn't get misread as a toolbar change. */
if (window.visualViewport) {
  const vv = window.visualViewport;
  const updateVVLift = () => {
    const layoutH = document.documentElement.clientHeight;
    const lift = vv.scale <= 1.02 ? Math.max(0, layoutH - (vv.height + vv.offsetTop)) : 0;
    document.documentElement.style.setProperty('--vv-lift', lift + 'px');
  };
  vv.addEventListener('resize', updateVVLift);
  vv.addEventListener('scroll', updateVVLift);
  window.addEventListener('resize', updateVVLift);
  window.addEventListener('orientationchange', updateVVLift);
  updateVVLift();
  // some browsers settle their toolbar/viewport metrics a moment after load,
  // without firing a visualViewport event — re-check a couple of times to catch that.
  setTimeout(updateVVLift, 300);
  setTimeout(updateVVLift, 1200);
}

const state = { mechanic:'follow', active:null, hinted:false, mobileCity:'ant' };

const panels = {}; // filled by boot() once content is rendered

function applySplit(){
  const c = COMPACTION;
  const growExpanded = 1 + c, growCompact = 1 - c;
  SITE_DATA.cities.forEach(city => {
    const el = panels[city.id];
    let grow = 1, compact = false;
    if (state.active !== null){
      if (state.active === city.id) grow = growExpanded;
      else { grow = growCompact; compact = true; }
    }
    el.style.flexGrow = grow;
    el.classList.toggle('compact', compact);
  });
  const seamPct = state.active === 'ant' ? (1+c)/2*100 : (state.active === 'kor' ? (1-c)/2*100 : 50);
  seam.style.left = seamPct + '%';
}

let flareT;
function flare(){
  seam.classList.add('flare');
  clearTimeout(flareT);
  flareT = setTimeout(()=> seam.classList.remove('flare'), 850);
}

function setActive(id){
  if (state.active === id) return;
  state.active = id;
  flare();
  if (!state.hinted){ state.hinted = true; hintEl.classList.add('hide'); }
  applySplit();
}

/* desktop hover-follow */
stage.addEventListener('mousemove', e => {
  if (mq.matches || state.mechanic !== 'follow') return;
  const w = window.innerWidth, x = e.clientX, c = COMPACTION, buf = 10, a = state.active;
  let z;
  if (a === 'ant') z = x > ((1+c)/2)*w + buf ? 'kor' : 'ant';
  else if (a === 'kor') z = x < ((1-c)/2)*w - buf ? 'ant' : 'kor';
  else z = x < w*0.46 ? 'ant' : (x > w*0.54 ? 'kor' : null);
  setActive(z);
});
stage.addEventListener('mouseleave', () => {
  if (!mq.matches && state.mechanic === 'follow') setActive(null);
});

/* desktop click-lock + slot toggling (delegated) */
stage.addEventListener('click', e => {
  const toggleAll = e.target.closest('[data-toggle-all]');
  if (toggleAll){
    const panel = toggleAll.closest('.panel');
    const bodies = panel.querySelectorAll('.slot-body');
    const anyClosed = [...bodies].some(b => !b.classList.contains('open'));
    bodies.forEach(b => b.classList.toggle('open', anyClosed));
    panel.querySelectorAll('.slot-chev').forEach(c => c.textContent = anyClosed ? '–' : '+');
    const lbl = labelSet(SITE_DATA || {});
    toggleAll.textContent = anyClosed ? lbl.verbergInfo : lbl.klikVoorInfo;
    return;
  }
  const row = e.target.closest('.slot-row');
  if (row){
    const key = row.getAttribute('data-toggle');
    const body = stage.querySelector('[data-body="'+key+'"]');
    const chev = stage.querySelector('[data-chev="'+key+'"]');
    const open = body.classList.toggle('open');
    chev.textContent = open ? '–' : '+';
    return;
  }
  if (mq.matches || state.mechanic !== 'lock') return;
  const panel = e.target.closest('.panel');
  if (!panel) return;
  const id = panel.getAttribute('data-id');
  setActive(state.active === id ? null : id);
});

/* palette switching (theme presets) */
const palettebar = document.getElementById('palettebar');
const palettepop = document.getElementById('palettepop');
const palettename = document.getElementById('palettename');
const pdotA = document.getElementById('pdot-a');
const pdotK = document.getElementById('pdot-k');
const withA = (c, a) => c.replace(/\)\s*$/, ' / ' + a + ')');
let curPal = PALETTES[0];

function applyPalette(p){
  curPal = p;
  [['ant', p.ant], ['kor', p.kor]].forEach(([id, c]) => {
    const el = panels[id];
    el.style.setProperty('--bg', c.bg);
    el.style.setProperty('--fg', c.fg);
    el.style.setProperty('--mut', c.mut);
    el.style.setProperty('--acc', c.acc);
    el.style.setProperty('--glow', withA(c.acc, 0.14));
    el.style.setProperty('--line', c.line);
  });
  seam.style.background = 'linear-gradient(90deg, transparent, ' + withA(p.ant.acc, 0.45) + ' 30%, ' + withA(p.mid, 0.78) + ' 50%, ' + withA(p.kor.acc, 0.45) + ' 70%, transparent)';
  pdotA.style.cssText = 'background:' + p.ant.acc + ';color:' + p.ant.acc;
  pdotK.style.cssText = 'background:' + p.kor.acc + ';color:' + p.kor.acc;
  palettename.textContent = p.name;
  palettepop.querySelectorAll('.palrow').forEach(r => r.classList.toggle('on', r.dataset.pid === p.id));
  citytoggle.style.setProperty('--toggle-acc', (state.mobileCity === 'ant' ? p.ant : p.kor).acc);
}

palettepop.innerHTML = PALETTES.map(p =>
  '<div class="palrow" data-pid="' + p.id + '">' +
    '<span class="sw"><i style="background:' + p.ant.acc + ';color:' + p.ant.acc + '"></i>' +
    '<i style="background:' + p.kor.acc + ';color:' + p.kor.acc + '"></i></span>' +
    '<span class="nm">' + p.name + '</span></div>'
).join('');
palettepop.querySelectorAll('.palrow').forEach(r => r.addEventListener('click', () => {
  applyPalette(PALETTES.find(p => p.id === r.dataset.pid));
  palettebar.classList.remove('open');
}));
document.getElementById('palettebtn').addEventListener('click', e => { e.stopPropagation(); palettebar.classList.toggle('open'); });
document.addEventListener('click', e => { if (!palettebar.contains(e.target)) palettebar.classList.remove('open'); });

/* mobile city toggle */
function setMobileCity(id){
  state.mobileCity = id;
  stage.setAttribute('data-mobile-city', id);
  citytoggle.style.setProperty('--toggle-acc', (id === 'ant' ? curPal.ant : curPal.kor).acc);
  citytoggle.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.city === id));
}
citytoggle.querySelectorAll('button').forEach(b => {
  b.addEventListener('click', () => setMobileCity(b.dataset.city));
});

/* top controls */
document.querySelectorAll('[data-look]').forEach(b => b.addEventListener('click', () => {
  document.documentElement.setAttribute('data-theme', b.dataset.look);
  document.querySelectorAll('[data-look]').forEach(x => x.classList.toggle('on', x === b));
}));
document.querySelectorAll('[data-mech]').forEach(b => b.addEventListener('click', () => {
  state.mechanic = b.dataset.mech; state.active = null; applySplit();
  document.querySelectorAll('[data-mech]').forEach(x => x.classList.toggle('on', x === b));
}));

function syncHint(){
  if (mq.matches || state.hinted){ hintEl.classList.add('hide'); return; }
  hintEl.classList.remove('hide');
  hintEl.textContent = state.mechanic === 'follow' ? 'beweeg naar links of rechts' : 'klik een stad';
}
mq.addEventListener('change', () => { state.active = null; applySplit(); syncHint(); });

/* boot — load the content files (festival, both cities, artists, news), then render + init */
document.querySelector('[data-look="seance"]').classList.add('on');
document.querySelector('[data-mech="follow"]').classList.add('on');

async function boot(){
  // production: build.mjs already pre-rendered the panels and inlined the data.
  const preRendered = stage.querySelector('.panel');

  if (!SITE_DATA) {
    const getJson = async (name, optional) => {
      try {
        const res = await fetch('content/' + name, { cache: 'no-store' });
        if (!res.ok) throw new Error(name + ': HTTP ' + res.status);
        return res.json();
      } catch (err) {
        if (optional) return null;
        throw err;
      }
    };
    try {
      const [fest, ant, kor, art, nws] = await Promise.all([
        getJson('festival.json'), getJson('antwerpen.json'), getJson('kortrijk.json'),
        getJson('artiesten.json', true), getJson('nieuws.json', true),
      ]);
      SITE_DATA = {
        theme: fest.theme, festival: fest.festival, labels: fest.labels || {},
        cities: [ant, kor],
        artists: (art && art.artists) || [],
        news: nws || { posts: [], posters: [] },
      };
    } catch (err) {
      stage.innerHTML = '<div style="margin:auto;max-width:46ch;padding:40px;font-family:var(--f-mono);font-size:13px;line-height:1.7;color:#bbb;text-align:center;">' +
        'Kon de inhoud uit <b>content/</b> niet laden.<br><br>Open deze site via een (lokale) webserver, niet rechtstreeks vanaf het bestand. ' +
        'Bv. in deze map:<br><code style="color:#7fd4c1;">python -m http.server</code><br>en ga naar <code style="color:#7fd4c1;">http://localhost:8000</code>.<br><br>' +
        '<span style="color:#666;">(' + err.message + ')</span></div>';
      return;
    }
  }

  if (!preRendered) stage.innerHTML = renderPanels(SITE_DATA);
  SITE_DATA.cities.forEach(c => { panels[c.id] = stage.querySelector('.panel[data-id="'+c.id+'"]'); });

  // mobile city-switch labels come from the content, not hardcoded text
  citytoggle.querySelectorAll('button').forEach(b => {
    const c = SITE_DATA.cities.find(x => x.id === b.dataset.city);
    if (c) b.textContent = c.name;
  });

  const startPal = PALETTES.find(p => p.id === SITE_DATA.theme) || PALETTES[0];
  applyPalette(startPal);
  setMobileCity('ant');
  applySplit();
  syncHint();
}
boot();
</script>
