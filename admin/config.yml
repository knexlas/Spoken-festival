# =============================================================================
# CMS-configuratie (Sveltia CMS, Decap-compatibel formaat) — beheert de
# bestanden in content/ met een visuele editor op /admin. Aparte bestanden
# per onderwerp zodat de editor overzichtelijke items toont:
# Festival-instellingen, Antwerpen, Kortrijk, Artiesten & gasten,
# Nieuws & affiches. De editor zelf is Sveltia (geladen in admin/index.html),
# een moderne drop-in vervanger voor Decap die exact dit configformaat leest.
#
# BACKEND: rechtstreekse GitHub-login (Netlify Identity/Git Gateway is
# deprecated door Netlify en bleek niet betrouwbaar op nieuwe sites — zie
# README.md voor de volledige uitleg). Editors loggen in met hun eigen
# GitHub-account via "Sign in with GitHub"; ze moeten wel als collaborator op
# de repo staan (Settings → Collaborators op github.com/knexlas/Spoken-festival).
#
# Vereist eenmalig in Netlify: Site configuration → Access & security → OAuth
# → "Install provider" → GitHub, met een Client ID + Client Secret van een
# GitHub OAuth App (github.com/settings/developers → New OAuth App):
#   Homepage URL:            https://spokenfestival.netlify.app
#   Authorization callback:  https://api.netlify.com/auth/done
# (base_url/auth_endpoint hieronder laten de CMS die Netlify-koppeling
# gebruiken in plaats van zelf een OAuth-server te hoeven draaien; Sveltia
# ondersteunt deze bestaande koppeling ongewijzigd.)
# =============================================================================

# On-brand titel in login/header/browsertab (Sveltia-optie). Een vierkant
# logo kan later toegevoegd worden via:  logo: { src: /assets/uploads/spoken-logo.png }
app_title: "SPOKEN — Beheer"

backend:
  name: github
  repo: knexlas/Spoken-festival
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Lokaal testen: Sveltia heeft geen proxy-server nodig — open /admin op een
# lokale server en kies "Work with Local Repository" (Chrome/Edge), dat
# rechtstreeks in de projectmap leest/schrijft. local_backend blijft staan
# voor het geval er ooit naar Decap wordt teruggeschakeld (Sveltia negeert het).
local_backend: true

# Geüploade afbeeldingen komen hier terecht (en worden mee gedeployed).
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Publiceren gaat rechtstreeks (geen aparte review-stap). Zet onderstaande aan
# voor een review-workflow via pull requests:
# publish_mode: editorial_workflow

locale: "nl"

# Herbruikbare veld-structuur voor een stad (YAML-anker) — Antwerpen en
# Kortrijk hebben exact dezelfde opbouw, dus die wordt hier één keer
# gedefinieerd en hieronder tweemaal hergebruikt (*city_fields).
city_fields: &city_fields
  - { label: "ID", name: "id", widget: "hidden" }
  - { label: "Zijde", name: "side", widget: "hidden" }
  - { label: "Naam van de stad", name: "name", widget: "string" }
  - { label: "Tagline (korte sfeerbeschrijving onder de stadsnaam)", name: "tagline", widget: "text" }
  - { label: "Datums (zoals getoond op de site)", name: "dates", widget: "string", hint: "Bv. 31 OKT – 01 NOV 2026" }
  - { label: "Locatie / venue", name: "venue", widget: "string", hint: "Bv. Blikfabriek" }
  - { label: "Stad (voor Google/kaarten)", name: "addressLocality", widget: "string", hint: "Bv. Antwerpen" }
  - { label: "Landcode (voor Google/kaarten)", name: "addressCountry", widget: "string", hint: "BE voor België — normaal niet wijzigen" }
  - { label: "Tekstje dat naar de andere stad verwijst", name: "twin", widget: "string", hint: "Bv. 'Tegelijk in Kortrijk →'" }
  - { label: "Tekstje in de smalle zijbalk (alleen desktop)", name: "railCue", widget: "string", hint: "Kort woord dat uitnodigt om deze stad open te klappen, bv. 'verken →'" }
  - { label: "Ticket-link", name: "ticketUrl", widget: "string", hint: "Volledige link naar de ticketshop (https://…), of #tickets zolang die er nog niet is" }

  - label: "Info-paragrafen"
    name: "info"
    label_singular: "Paragraaf"
    widget: "list"
    collapsed: true
    field: { label: "Paragraaf", name: "paragraph", widget: "text" }

  - label: "Kerncijfers"
    name: "facts"
    label_singular: "Cijfer"
    widget: "list"
    collapsed: true
    summary: "{{fields.k}}: {{fields.v}}"
    fields:
      - { label: "Label", name: "k", widget: "string" }
      - { label: "Waarde", name: "v", widget: "string" }

  - label: "Praktisch"
    name: "practical"
    label_singular: "Item"
    widget: "list"
    collapsed: true
    summary: "{{fields.k}}: {{fields.v}}"
    fields:
      - { label: "Label", name: "k", widget: "string" }
      - { label: "Waarde", name: "v", widget: "string" }

  - label: "Tickets"
    name: "tickets"
    label_singular: "Ticket"
    widget: "list"
    collapsed: true
    summary: "{{fields.tier}} — {{fields.price}}"
    fields:
      - { label: "Type", name: "tier", widget: "string" }
      - { label: "Prijs", name: "price", widget: "string", hint: "Bv. €39" }
      - { label: "Toelichting", name: "note", widget: "string" }

collections:
  - name: "site"
    label: "Festivalwebsite"
    delete: false
    files:
      - name: "festival"
        label: "Festival-instellingen"
        file: "content/festival.json"
        description: "Thema, naam, datums en SEO-gegevens voor de hele site."
        fields:
          # NB: het oude "Kleurthema"-veld is verdwenen met het v3-ontwerp —
          # de kleuren zijn nu een vast onderdeel van de geïllustreerde
          # huisstijl (krijtblauw Antwerpen, gebrand oranje Kortrijk, geel).
          - label: "Festival"
            name: "festival"
            widget: "object"
            fields:
              - { label: "Naam van het festival", name: "name", widget: "string" }
              - { label: "Ondertitel", name: "subtitle", widget: "string", required: false, hint: "Korte, krachtige zin die op de homepage verschijnt, onder het SPOKEN-logo." }
              - { label: "Jaar (editie)", name: "year", widget: "string", hint: "Bv. 2026" }
              - { label: "Korte datum (naast het logo)", name: "shortDate", widget: "string", required: false, hint: "Bv. 31.10.2026 — het gele, schuine datumlabel bovenaan." }
              - { label: "Website-adres", name: "siteUrl", widget: "string", hint: "Bv. https://www.spokenfestival.be — normaal niet wijzigen" }
              - { label: "Organisator", name: "organizer", widget: "string", hint: "Bv. Vonk en Zonen" }
              - { label: "Taal/regio (technisch, voor social media)", name: "locale", widget: "string", required: false, hint: "nl_BE — normaal niet wijzigen" }
              - { label: "Startdatum & -tijd", name: "startDate", widget: "datetime", picker_utc: false, hint: "Officiële start van het festival (gebruikt door Google)" }
              - { label: "Einddatum & -tijd", name: "endDate", widget: "datetime", picker_utc: false, hint: "Officieel einde van het festival (gebruikt door Google)" }
              - { label: "Omschrijving (voor Google & delen)", name: "description", widget: "text", hint: "1 à 2 zinnen; dit is de tekst die Google en social media tonen." }
              - { label: "Deelafbeelding (1200×630)", name: "shareImage", widget: "image", required: false, hint: "Afbeelding die verschijnt als de site gedeeld wordt op social media." }

          - label: "Festivaldagen"
            name: "days"
            label_singular: "Dag"
            widget: "list"
            hint: "De dagen van het festival — gelden voor beide steden. De optredens (bij Artiesten & gasten) verwijzen naar deze dagen."
            summary: "{{fields.label}} {{fields.date}}"
            fields:
              - { label: "Code", name: "id", widget: "string", hint: "Kort en uniek, bv. vr of za. NIET meer wijzigen zodra er optredens aan gekoppeld zijn." }
              - { label: "Naam (zoals getoond)", name: "label", widget: "string", hint: "Bv. VR" }
              - { label: "Datum (zoals getoond)", name: "date", widget: "string", hint: "Bv. 31 OKT" }

          - label: "Teksten & knoppen (site-breed)"
            name: "labels"
            widget: "object"
            collapsed: true
            required: false
            hint: "Alle koppen en knopteksten op de site. Normaal hoef je hier niets te wijzigen."
            fields:
              - { label: "Kop: programma", name: "programma", widget: "string", required: false }
              - { label: "Kop: nieuws", name: "nieuws", widget: "string", required: false }
              - { label: "Kop: info", name: "info", widget: "string", required: false }
              - { label: "Kop: praktisch", name: "praktisch", widget: "string", required: false }
              - { label: "Kop: affiches", name: "affiches", widget: "string", required: false }
              - { label: "Kop: tickets", name: "tickets", widget: "string", required: false }
              - { label: "Knop: alles openklappen", name: "klikVoorInfo", widget: "string", required: false }
              - { label: "Knop: alles dichtklappen", name: "verbergInfo", widget: "string", required: false }
              - { label: "Knop: tickets (bovenaan)", name: "ticketsKnop", widget: "string", required: false }
              - { label: "Knop: koop (per ticket)", name: "koopKnop", widget: "string", required: false }
              - { label: "Placeholder: foto ontbreekt nog", name: "fotoVolgt", widget: "string", required: false }
              - { label: "Linktekst: meer over [artiest]", name: "meerOver", widget: "string", required: false }
              - { label: "Uitleg bij eerste bezoek (desktop, hover-modus)", name: "hintBeweeg", widget: "string", required: false }
              - { label: "Uitleg bij eerste bezoek (desktop, klik-modus)", name: "hintKlik", widget: "string", required: false }
              - { label: "Kop: blokkenschema", name: "blokkenschema", widget: "string", required: false }
              - { label: "Label: ook te zien (kruisverwijzing artiest)", name: "ookTeZien", widget: "string", required: false }
              - { label: "Footer-label (bv. GRIEZELFESTIVAL)", name: "footerTag", widget: "string", required: false }
              - { label: "Intro-knop (openingsvideo)", name: "introKnop", widget: "string", required: false }
              - { label: "Kop: subprogramma", name: "subprogramma", widget: "string", required: false }

      - name: "antwerpen"
        label: "Antwerpen"
        file: "content/antwerpen.json"
        description: "De Antwerpse editie: info, praktisch en tickets. Het programma zelf beheer je bij 'Artiesten & gasten' (optredens) — het verschijnt hier automatisch."
        fields: *city_fields

      - name: "kortrijk"
        label: "Kortrijk"
        file: "content/kortrijk.json"
        description: "De Kortrijkse editie: info, praktisch en tickets. Het programma zelf beheer je bij 'Artiesten & gasten' (optredens) — het verschijnt hier automatisch."
        fields: *city_fields

      - name: "artiesten"
        label: "Artiesten & gasten"
        file: "content/artiesten.json"
        description: "Alles over wie er komt én wanneer ze optreden. De programma's en blokkenschema's van Antwerpen en Kortrijk worden hier automatisch uit opgebouwd — dit is de enige plek waar je tijden en podia beheert."
        fields:
          - label: "Artiesten & gasten"
            name: "artists"
            label_singular: "Artiest / gast"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { label: "Naam", name: "name", widget: "string", hint: "Deze naam verschijnt in het programma en op de site." }
              - { label: "Foto", name: "photo", widget: "image", required: false, hint: "Liggende foto werkt het best (bv. 800×600)." }
              - { label: "Beschrijving / bio", name: "bio", widget: "text", required: false, hint: "Korte introductie; verschijnt onder het programmaonderdeel." }
              - { label: "Website of social-link", name: "link", widget: "string", required: false, hint: "https://… (optioneel)" }
              - label: "Optredens"
                name: "performances"
                label_singular: "Optreden"
                widget: "list"
                collapsed: true
                required: false
                summary: "{{fields.city}} · {{fields.day}} · {{fields.time}}"
                hint: "Wanneer en waar deze artiest optreedt. Eén artiest kan meerdere optredens hebben, ook in beide steden. Dit vult automatisch het programma én het blokkenschema van de juiste stad."
                fields:
                  - label: "Stad"
                    name: "city"
                    widget: "select"
                    options:
                      - { label: "Antwerpen", value: "ant" }
                      - { label: "Kortrijk", value: "kor" }
                  - label: "Dag"
                    name: "day"
                    widget: "relation"
                    collection: "site"
                    file: "festival"
                    search_fields: ["days.*.label"]
                    display_fields: ["days.*.label"]
                    value_field: "days.*.id"
                    hint: "Festivaldagen beheer je bij Festival-instellingen."
                  - { label: "Starttijd", name: "time", widget: "string", hint: "Bv. 20:00" }
                  - { label: "Eindtijd", name: "end", widget: "string", required: false, hint: "Bv. 21:00 — leeg gelaten telt als 1 uur (voor het blokkenschema)." }
                  - { label: "Podium / zaal", name: "stage", widget: "string" }
                  - { label: "Genre / vorm", name: "genre", widget: "string", hint: "Bv. Lezing, Interview, Poëzie, Spoken word, Paneldiscussie, Signeersessie" }
                  - { label: "Omschrijving van dit optreden", name: "blurb", widget: "text", required: false }
                  - label: "Subprogramma (onderdelen binnen dit optreden)"
                    name: "subprogram"
                    label_singular: "Onderdeel"
                    widget: "list"
                    collapsed: true
                    required: false
                    summary: "{{fields.title}}"
                    hint: "Optioneel. Voor optredens die uit meerdere onderdelen bestaan (bv. meerdere lezingen of workshopdelen). Op de site kan de bezoeker elk onderdeel verder openklappen voor de tekst."
                    fields:
                      - { label: "Titel", name: "title", widget: "string" }
                      - { label: "Tijd", name: "time", widget: "string", required: false, hint: "Optioneel, bv. 21:20" }
                      - { label: "Tekst", name: "text", widget: "text", required: false }

      - name: "nieuws"
        label: "Nieuws & affiches"
        file: "content/nieuws.json"
        description: "Nieuwsberichten en affiches/posters. Verschijnen vanzelf op de site zodra er iets in staat."
        fields:
          - label: "Nieuwsberichten"
            name: "posts"
            label_singular: "Bericht"
            widget: "list"
            collapsed: true
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Datum (zoals getoond)", name: "date", widget: "string", hint: "Bv. 15 juni 2026" }
              - { label: "Afbeelding", name: "image", widget: "image", required: false }
              - { label: "Tekst", name: "body", widget: "text", hint: "Witregel = nieuwe alinea." }
          - label: "Affiches / posters"
            name: "posters"
            label_singular: "Affiche"
            widget: "list"
            collapsed: true
            summary: "{{fields.caption}}"
            fields:
              - { label: "Afbeelding", name: "image", widget: "image" }
              - { label: "Onderschrift", name: "caption", widget: "string", required: false }
