# =============================================================================
# Decap CMS — beheert content/festival.json, content/antwerpen.json en
# content/kortrijk.json met een visuele editor op /admin. Drie aparte
# bestanden (i.p.v. één grote) zodat de editor drie overzichtelijke items
# toont: Festival-instellingen, Antwerpen, Kortrijk.
#
# BACKEND: rechtstreekse GitHub-login (Netlify Identity/Git Gateway is
# deprecated door Netlify en bleek niet betrouwbaar op nieuwe sites — zie
# README.md voor de volledige uitleg). Editors loggen in met hun eigen
# GitHub-account via "Login with GitHub"; ze moeten wel als collaborator op
# de repo staan (Settings → Collaborators op github.com/knexlas/Spoken-festival).
#
# Vereist eenmalig in Netlify: Site configuration → Access & security → OAuth
# → "Install provider" → GitHub, met een Client ID + Client Secret van een
# GitHub OAuth App (github.com/settings/developers → New OAuth App):
#   Homepage URL:            https://spokenfestival.netlify.app
#   Authorization callback:  https://api.netlify.com/auth/done
# (base_url/auth_endpoint hieronder laten Decap die Netlify-koppeling gebruiken
# in plaats van zelf een OAuth-server te hoeven draaien.)
# =============================================================================

backend:
  name: github
  repo: knexlas/Spoken-festival
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Laat de editor lokaal testen via:  npx decap-server  (samen met de site op localhost)
local_backend: true

# Geüploade afbeeldingen komen hier terecht (en worden mee gedeployed).
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Publiceren gaat rechtstreeks (geen aparte review-stap). Zet onderstaande aan
# voor een review-workflow via pull requests:
# publish_mode: editorial_workflow

locale: "nl"

# Herbruikbare veld-structuur voor een stad (YAML-anker) — Antwerpen en
# Kortrijk hebben exact dezelfde opbouw, dus die wordt hier één keer
# gedefinieerd en hieronder tweemaal hergebruikt (*city_fields).
city_fields: &city_fields
  - { label: "ID", name: "id", widget: "hidden" }
  - { label: "Zijde", name: "side", widget: "hidden" }
  - { label: "Naam", name: "name", widget: "string" }
  - { label: "Tagline", name: "tagline", widget: "text" }
  - { label: "Datums (tekst)", name: "dates", widget: "string", hint: "Bv. 31 OKT – 01 NOV 2026" }
  - { label: "Locatie / venue", name: "venue", widget: "string" }
  - { label: "Stad (adres)", name: "addressLocality", widget: "string" }
  - { label: "Landcode", name: "addressCountry", widget: "string", hint: "Bv. BE" }
  - { label: "Verwijzing andere stad", name: "twin", widget: "string" }
  - { label: "Rail-cue", name: "railCue", widget: "string" }
  - { label: "Ticket-link", name: "ticketUrl", widget: "string" }

  - label: "Programma (dagen)"
    name: "days"
    label_singular: "Dag"
    widget: "list"
    collapsed: true
    summary: "{{fields.day}} {{fields.date}}"
    fields:
      - { label: "Dag", name: "day", widget: "string", hint: "Bv. VR" }
      - { label: "Datum", name: "date", widget: "string", hint: "Bv. 31 OKT" }
      - label: "Programmaonderdelen"
        name: "slots"
        label_singular: "Programmaonderdeel"
        widget: "list"
        collapsed: true
        summary: "{{fields.time}} — {{fields.artist}}"
        fields:
          - { label: "Tijd", name: "time", widget: "string", hint: "Bv. 20:00" }
          - { label: "Naam (auteur / gast / performer)", name: "artist", widget: "string" }
          - { label: "Podium / zaal", name: "stage", widget: "string" }
          - { label: "Genre / vorm", name: "genre", widget: "string", hint: "Bv. Lezing, Interview, Poëzie, Spoken word, Paneldiscussie, Signeersessie" }
          - { label: "Omschrijving", name: "blurb", widget: "text" }

  - label: "Info-paragrafen"
    name: "info"
    label_singular: "Paragraaf"
    widget: "list"
    collapsed: true
    field: { label: "Paragraaf", name: "paragraph", widget: "text" }

  - label: "Kerncijfers"
    name: "facts"
    label_singular: "Cijfer"
    widget: "list"
    collapsed: true
    summary: "{{fields.k}}: {{fields.v}}"
    fields:
      - { label: "Label", name: "k", widget: "string" }
      - { label: "Waarde", name: "v", widget: "string" }

  - label: "Praktisch"
    name: "practical"
    label_singular: "Item"
    widget: "list"
    collapsed: true
    summary: "{{fields.k}}: {{fields.v}}"
    fields:
      - { label: "Label", name: "k", widget: "string" }
      - { label: "Waarde", name: "v", widget: "string" }

  - label: "Tickets"
    name: "tickets"
    label_singular: "Ticket"
    widget: "list"
    collapsed: true
    summary: "{{fields.tier}} — {{fields.price}}"
    fields:
      - { label: "Type", name: "tier", widget: "string" }
      - { label: "Prijs", name: "price", widget: "string", hint: "Bv. €39" }
      - { label: "Toelichting", name: "note", widget: "string" }

collections:
  - name: "site"
    label: "Festivalwebsite"
    delete: false
    files:
      - name: "festival"
        label: "Festival-instellingen"
        file: "content/festival.json"
        description: "Thema, naam, datums en SEO-gegevens voor de hele site."
        fields:
          - label: "Kleurthema"
            name: "theme"
            widget: "select"
            hint: "Sfeerpalet voor de hele site."
            options:
              - { label: "Spectraal", value: "spectraal" }
              - { label: "Necropolis", value: "necropolis" }
              - { label: "Maanlicht", value: "maanlicht" }
              - { label: "Vagevuur", value: "vagevuur" }
              - { label: "Ectoplasma", value: "ectoplasma" }
              - { label: "Nevel", value: "nevel" }
              - { label: "Nachtschade", value: "nachtschade" }
              - { label: "Wierook", value: "wierook" }
              - { label: "As", value: "as" }
              - { label: "Sint-Elmsvuur", value: "sintelmsvuur" }

          - label: "Festival"
            name: "festival"
            widget: "object"
            fields:
              - { label: "Naam", name: "name", widget: "string" }
              - { label: "Ondertitel", name: "subtitle", widget: "string", required: false, hint: "Korte, krachtige zin die op de homepage verschijnt, onder het SPOKEN-logo." }
              - { label: "Jaar", name: "year", widget: "string" }
              - { label: "Website-URL", name: "siteUrl", widget: "string", hint: "Bv. https://www.spokenfestival.be" }
              - { label: "Organisator", name: "organizer", widget: "string" }
              - { label: "Taal/regio (og:locale)", name: "locale", widget: "string", required: false }
              - { label: "Startdatum & -tijd", name: "startDate", widget: "datetime", picker_utc: false }
              - { label: "Einddatum & -tijd", name: "endDate", widget: "datetime", picker_utc: false }
              - { label: "Omschrijving (voor Google & delen)", name: "description", widget: "text" }
              - { label: "Deelafbeelding (1200×630)", name: "shareImage", widget: "image", required: false, hint: "Toont bij delen op social media." }

      - name: "antwerpen"
        label: "Antwerpen"
        file: "content/antwerpen.json"
        description: "Alles voor de Antwerpse editie: programma, info, praktisch en tickets."
        fields: *city_fields

      - name: "kortrijk"
        label: "Kortrijk"
        file: "content/kortrijk.json"
        description: "Alles voor de Kortrijkse editie: programma, info, praktisch en tickets."
        fields: *city_fields
